<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="budgetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141026" />
      <stop offset="50%" stop-color="#050816" />
      <stop offset="100%" stop-color="#1e1338" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#budgetBg)" />

  <!-- E-commerce Exchange Diagram -->
  <rect x="180" y="170" width="180" height="150" rx="6" fill="#1b1433" stroke="#f59e0b" stroke-width="1.5" />
  <text x="270" y="220" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-weight="700" font-size="14">CAMPUS_STORE</text>
  <text x="270" y="245" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">STUDENT LISTINGS</text>
  <text x="270" y="270" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">ESCROW // VERIFIED</text>

  <!-- Exchange Arrows -->
  <path d="M 390 220 L 460 220" stroke="#fbbf24" stroke-width="2" />
  <path d="M 450 215 L 460 220 L 450 225" fill="#fbbf24" />
  <path d="M 460 270 L 390 270" stroke="#00f0ff" stroke-width="2" />
  <path d="M 400 265 L 390 270 L 400 275" fill="#00f0ff" />

  <rect x="490" y="170" width="180" height="150" rx="6" fill="#111c38" stroke="#00f0ff" stroke-width="1.5" />
  <text x="580" y="220" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-weight="700" font-size="14">PEER_EXCHANGE</text>
  <text x="580" y="245" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">INSTANT SETTLEMENT</text>
  <text x="580" y="270" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">STUDENT WALLET</text>

  <!-- Typography -->
  <text x="50" y="60" fill="#fbbf24" font-family="monospace" font-size="12" letter-spacing="3">[ UNIVERSITY COMMERCE PLATFORM ]</text>
  <text x="50" y="86" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="22">MyBudget: Peer-to-Peer Campus Marketplace</text>
  <text x="50" y="445" fill="#94a3b8" font-family="monospace" font-size="11">TRANSACTION ENGINE // SECOND-HAND GOODS EXCHANGE // REAL-TIME CHAT</text>
  <text x="750" y="445" text-anchor="end" fill="#fbbf24" font-family="monospace" font-size="11">ASTU ECOSYSTEM</text>
</svg>
