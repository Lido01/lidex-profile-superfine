      <stop offset="0%" stop-color="#0c1713" />
      <stop offset="50%" stop-color="#050816" />
      <stop offset="100%" stop-color="#0f241a" />
    </linearGradient>
    <linearGradient id="djangoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#apiBg)" />

  <!-- REST API Graph Topology -->
  <g stroke="rgba(52, 211, 153, 0.15)" stroke-width="1.5">
    <circle cx="200" cy="240" r="45" fill="#0d291e" stroke="#10b981" />
    <circle cx="360" cy="180" r="35" fill="#0d291e" stroke="#34d399" />
    <circle cx="360" cy="300" r="35" fill="#0d291e" stroke="#34d399" />
    <circle cx="520" cy="180" r="35" fill="#0d291e" stroke="#10b981" />
    <circle cx="520" cy="300" r="35" fill="#0d291e" stroke="#10b981" />
    <circle cx="660" cy="240" r="45" fill="#0d291e" stroke="#059669" />

    <line x1="245" y1="225" x2="325" y2="195" />
    <line x1="245" y1="255" x2="325" y2="285" />
    <line x1="395" y1="180" x2="485" y2="180" />
    <line x1="395" y1="300" x2="485" y2="300" />
    <line x1="555" y1="195" x2="615" y2="225" />
