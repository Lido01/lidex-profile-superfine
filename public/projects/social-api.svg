  <text x="50" y="86" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="22">Social-Media-API: High-Throughput REST Core</text>
  <text x="50" y="445" fill="#94a3b8" font-family="monospace" font-size="11">DJANGO REST FRAMEWORK // RELATIONAL CRUD // SUB-25MS LATENCY</text>
  <text x="750" y="445" text-anchor="end" fill="#10b981" font-family="monospace" font-size="11">LIDO01/ALX_DJANGOLEARNLAB</text>
