<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c1a" />
      <stop offset="50%" stop-color="#050816" />
      <stop offset="100%" stop-color="#0d1430" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)" />
  
  <!-- Cyber Matrix Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Agent Node Core -->
  <circle cx="400" cy="230" r="90" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-dasharray="6,6" opacity="0.8" />
  <circle cx="400" cy="230" r="65" fill="#0c1228" stroke="url(#accentPurple)" stroke-width="2" />
  <circle cx="400" cy="230" r="28" fill="#00f0ff" opacity="0.85" />
  
  <!-- Network Satellite Nodes -->
  <line x1="400" y1="165" x2="400" y2="90" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="400" cy="80" r="14" fill="#0e1738" stroke="#00f0ff" stroke-width="1.5" />
  
  <line x1="340" y1="260" x2="220" y2="320" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="210" cy="325" r="16" fill="#0e1738" stroke="#6366f1" stroke-width="1.5" />

  <line x1="460" y1="260" x2="580" y2="320" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="590" cy="325" r="16" fill="#0e1738" stroke="#a855f7" stroke-width="1.5" />

  <!-- Monospace Architectural Labels -->
  <text x="40" y="55" fill="#00f0ff" font-family="monospace" font-size="12" letter-spacing="3">[ AGENTIC TELEGRAM CORE ]</text>
  <text x="40" y="78" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="22">Autonomous Channel Orchestration</text>
  <text x="40" y="450" fill="#94a3b8" font-family="monospace" font-size="11">DISPATCH: LANGCHAIN // CRON SCHEDULER // ASYNC TELEGRAM API</text>
  <text x="760" y="450" text-anchor="end" fill="#10b981" font-family="monospace" font-size="11">STATUS: OPERATIONAL 99.9%</text>
</svg>
