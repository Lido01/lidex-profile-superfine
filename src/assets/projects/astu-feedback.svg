  <text x="60" y="86" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="22">Institutional Student Feedback & Evaluation System</text>
  <text x="60" y="445" fill="#94a3b8" font-family="monospace" font-size="11">ADAMA SCIENCE &amp; TECHNOLOGY UNIVERSITY // ENTERPRISE JAVA ARCHITECTURE</text>
  <text x="740" y="445" text-anchor="end" fill="#06b6d4" font-family="monospace" font-size="11">LIVE PRODUCTION</text>
