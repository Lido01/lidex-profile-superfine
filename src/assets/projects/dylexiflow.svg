<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dyslexiaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c24" />
      <stop offset="50%" stop-color="#050816" />
      <stop offset="100%" stop-color="#180f33" />
    </linearGradient>
    <linearGradient id="flowWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#dyslexiaBg)" />

  <!-- Dynamic Reading Wave Grid -->
  <path d="M 100 240 Q 250 160 400 240 T 700 240" fill="none" stroke="url(#flowWave)" stroke-width="4" opacity="0.9" />
  <path d="M 100 270 Q 250 350 400 270 T 700 270" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6" />
  
  <!-- Optical Focus Glyphs -->
  <rect x="220" y="200" width="80" height="70" rx="6" fill="#1b1236" stroke="#a855f7" stroke-width="1.5" />
  <text x="260" y="242" text-anchor="middle" fill="#ffffff" font-family="monospace" font-weight="700" font-size="20">Aa</text>

  <rect x="360" y="190" width="90" height="90" rx="8" fill="#241747" stroke="#38bdf8" stroke-width="2" />
  <text x="405" y="243" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="22">FLOW</text>

  <rect x="510" y="200" width="80" height="70" rx="6" fill="#1b1236" stroke="#f43f5e" stroke-width="1.5" />
  <text x="550" y="242" text-anchor="middle" fill="#ffffff" font-family="monospace" font-weight="700" font-size="20">K-12</text>

  <!-- Typography -->
  <text x="50" y="60" fill="#a855f7" font-family="monospace" font-size="12" letter-spacing="3">[ OPEN SOURCE ACCESSIBILITY ]</text>
  <text x="50" y="86" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="22">DylexiFLOW: Assistive Reading Independence Engine</text>
  <text x="50" y="445" fill="#94a3b8" font-family="monospace" font-size="11">SPECIALIZED COGNITIVE ADAPTATION // DYSLEXIA &amp; ADHD READING PROTOCOL</text>
  <text x="750" y="445" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="11">PUBLIC OSS REPOSITORY</text>
</svg>
