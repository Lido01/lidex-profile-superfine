<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="stockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1724" />
      <stop offset="50%" stop-color="#050816" />
      <stop offset="100%" stop-color="#102538" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#stockBg)" />

  <!-- Inventory Matrix -->
  <g stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5">
    <rect x="180" y="160" width="120" height="70" fill="#0c1f33" />
    <rect x="340" y="160" width="120" height="70" fill="#0c1f33" />
    <rect x="500" y="160" width="120" height="70" fill="#0c1f33" />

    <rect x="180" y="260" width="120" height="70" fill="#0c1f33" />
    <rect x="340" y="260" width="120" height="70" fill="#0c1f33" />
    <rect x="500" y="260" width="120" height="70" fill="#0c1f33" />
  </g>

  <!-- Labels in inventory cells -->
  <text x="240" y="200" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="11">INVENTORY_A</text>
  <text x="400" y="200" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="11">WAREHOUSE_B</text>
  <text x="560" y="200" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="11">SUPPLY_LOG</text>

  <text x="240" y="300" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">AUDIT_TRAIL</text>
  <text x="400" y="300" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">LEDGER_SYNC</text>
  <text x="560" y="300" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="11">99.98% ACC</text>

  <!-- Header -->
  <text x="50" y="60" fill="#00f0ff" font-family="monospace" font-size="12" letter-spacing="3">[ INSTITUTIONAL BACKEND ARCHITECTURE ]</text>
  <text x="50" y="86" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="22">Enterprise Stock &amp; Inventory Management System</text>
  <text x="50" y="445" fill="#94a3b8" font-family="monospace" font-size="11">BACKEND ARCHITECT &amp; TEAM LEAD // HIGH-CONCURRENCY DATABASE TRANSACTIONS</text>
  <text x="750" y="445" text-anchor="end" fill="#00f0ff" font-family="monospace" font-size="11">PRODUCTION DEPLOYED</text>
</svg>
